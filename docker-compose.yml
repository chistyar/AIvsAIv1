version: '3.8'

services:
  rpi-hardware-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rpi-hardware-gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    # Privileged mode is recommended on Raspberry Pi for microsecond DHT11 pin timing,
    # direct memory-mapped GPIO access, and USB webcam video streams.
    privileged: true
    devices:
      - "/dev/gpiomem:/dev/gpiomem"
      - "/dev/i2c-1:/dev/i2c-1"
      - "/dev/video0:/dev/video0"
    environment:
      - GPIO_16_PIN=16
      - MOTOR_PWM_PIN=5
      - DHT11_PIN=26
      - MOTOR_PWM_FREQ=1000
      - I2C_BUS=1
      - LCD_UPDATE_INTERVAL_SEC=2.5
      - LCD_TEMP_MIN_OFFSET=8.0
      - CAMERA_INDEX=0
      - CAMERA_WIDTH=640
      - CAMERA_HEIGHT=480
      - MOCK_HARDWARE=false
