services:
  rpi-hardware-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rpi-hardware-gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    privileged: true
    environment:
      - GPIO_16_PIN=16
      - MOTOR_PWM_PIN=5
      - DHT11_PIN=26
      - MOTOR_PWM_FREQ=1000
      - I2C_BUS=1
      - LCD_UPDATE_INTERVAL_SEC=2.5
      - LCD_TEMP_MIN_OFFSET=8.0
      - CAMERA_INDEX=0
      - CAMERA_WIDTH=640
      - CAMERA_HEIGHT=480
      - MOCK_HARDWARE=false
